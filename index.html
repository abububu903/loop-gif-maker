<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>gif工具</title>
<style>
:root { --bd:#e2e2e6; --tx:#1c1c21; --dim:#8a8a93; --ac:#3d7eff; --tint:#edf3ff; --tint2:#f6f9ff; --bg:#f7f7f8; }
* { box-sizing:border-box; font-family:-apple-system,"PingFang SC",sans-serif; }
body { margin:0; color:var(--tx); background:var(--bg); font-size:13px; }
header { display:flex; gap:8px; align-items:center; padding:10px 14px;
         background:#fff; border-bottom:1px solid var(--bd); }
.brand { font-size:14px; font-weight:600; margin-right:2px; }
.tagline { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; }
.author { color:var(--dim); font-size:12px; flex:none; }
main { display:grid; grid-template-columns:230px 1fr 250px; height:calc(100vh - 53px); }
.panel { background:#fff; border-right:1px solid var(--bd); overflow:auto; }
.panel h3 { margin:0; padding:10px 12px 6px; font-size:12px; color:var(--dim); font-weight:600;
            display:flex; align-items:baseline; gap:8px; }
.panel h3 .clear { margin-left:auto; border:0; background:none; padding:0; font-size:12px;
                   color:var(--dim); font-weight:400; }
.panel h3 .clear:hover:not(:disabled) { color:var(--ac); }
.row { display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer;
       border-bottom:1px solid #f0f0f2; }
.row.sel { background:var(--tint); box-shadow:inset 2px 0 0 var(--ac); }
.row img { width:34px; height:34px; object-fit:contain; background:#fafafa;
           border:1px solid var(--bd); border-radius:4px; }
.row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button { border:1px solid var(--bd); background:#fff; border-radius:6px; padding:5px 10px;
         cursor:pointer; font-size:13px; }
button:hover:not(:disabled) { border-color:var(--ac); color:var(--ac); }
button:disabled { opacity:.45; cursor:default; }
button.prim { background:var(--ac); border-color:var(--ac); color:#fff; }
button.wide { display:block; width:100%; margin-top:8px; }
button.prim:hover:not(:disabled) { color:#fff; opacity:.9; }
.mini { padding:1px 6px; font-size:12px; }
.mini.icon { width:22px; height:22px; padding:0; display:inline-flex; align-items:center;
             justify-content:center; flex:none; }
.mini.icon svg { display:block; }
.menu { position:relative; }
.menu > .list { position:absolute; top:calc(100% + 6px); right:0; min-width:196px; display:none;
                background:#fff; border:1px solid var(--bd); border-radius:8px; padding:4px;
                box-shadow:0 10px 26px rgba(0,0,0,.14); z-index:20; }
.menu.on > .list { display:block; }
.menu .list button { display:block; width:100%; text-align:left; border:0; background:none;
                     padding:7px 9px; border-radius:6px; }
.menu .list button:hover:not(:disabled) { background:var(--tint); color:var(--tx); }
#chev { transition:transform .15s ease; }
.menu.on #chev { transform:rotate(180deg); }
#drop { display:block; width:calc(100% - 24px); margin:2px 12px 8px; padding:9px 10px;
        text-align:center; font-size:12px; color:var(--dim);
        border:1px dashed var(--bd); border-radius:8px; }
#drop.hot { border-color:var(--ac); background:var(--tint2); color:var(--ac); }
#dropSize { display:block; font-size:11px; }
#dropSize:not(:empty) { margin-top:3px; }
#preview { display:flex; flex-direction:column; align-items:center; padding:18px; overflow:auto; }
#stage { background:#fff; border:1px solid var(--bd); border-radius:8px; max-width:100%; height:auto; }
/* 透明模式下铺棋盘格：GIF 只有单色透明，边缘质量必须能看出「透在哪、糊在哪」 */
#stage.alpha { background-image:
  conic-gradient(#e9e9ee 0 25%, #fff 0 50%, #e9e9ee 0 75%, #fff 0);
  background-size:16px 16px; }
#scrubrow { display:flex; align-items:center; gap:10px; width:min(480px,90%); margin-top:12px; }
#scrub { flex:1; min-width:0; height:16px; margin:0; padding:0; border:0; background:none;
         -webkit-appearance:none; appearance:none; cursor:pointer; }
/* 原生 range 的轨道与滑块会被画成深色，这里自绘：底槽浅灰、已走过用主色、滑块灰色 */
#scrub::-webkit-slider-runnable-track { height:16px;
  background-image:linear-gradient(var(--ac), var(--ac)), linear-gradient(#dcdce1, #dcdce1);
  background-repeat:no-repeat; background-position:0 center, 0 center;
  background-size:var(--p, 0%) 4px, 100% 4px; }
#scrub::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; margin-top:2px;
  border-radius:50%; background:var(--dim); }
#scrub::-moz-range-track { height:4px; border-radius:2px; background:#dcdce1; }
#scrub::-moz-range-progress { height:4px; border-radius:2px; background:var(--ac); }
#scrub::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--dim); }
#meta { color:var(--dim); font-size:12px; margin-top:6px; }
form { padding:4px 12px 14px; }
.fld { display:flex; align-items:center; gap:6px; margin:5px 0; }
.fld label { width:44px; flex:none; color:var(--dim); font-size:12px; white-space:nowrap; }
.fld.off label { color:#c6c6cc; }
.fld input:not([type=checkbox]), .fld select { flex:1; min-width:0; }
.fld input[type=checkbox] { margin:0; }
.fld select { height:29px; }
.fld.solo > input:not([type=checkbox]) { flex:none; width:calc((100% - 10px)/2 - 50px); }
.pair { display:flex; gap:10px; }
.pair > .fld { flex:1 1 0; min-width:0; }
input, select { border:1px solid var(--bd); border-radius:6px; padding:4px 6px; font-size:13px;
                background:#fff; color:var(--tx); }
input:disabled, select:disabled { background:#f6f6f8; color:#bdbdc4; cursor:not-allowed; }
fieldset { border:0; margin:0; padding:0; min-width:0; display:contents; }
.grp { border-top:1px solid #f0f0f2; padding-top:4px; margin-top:8px; }
#props > .grp:first-child { border-top:0; margin-top:0; padding-top:0; }
.grp summary { font-size:12px; color:var(--dim); font-weight:600; padding:6px 0; cursor:pointer;
               display:flex; align-items:center; list-style:none; }
.grp summary::-webkit-details-marker { display:none; }
.grp summary::after { content:''; flex:none; margin-left:auto; width:7px; height:7px;
                      border-right:1.4px solid #c9c9d0; border-bottom:1.4px solid #c9c9d0;
                      transform:rotate(45deg); transition:transform .15s ease; }
.grp:not([open]) > summary::after { transform:rotate(-45deg); }
.grp > .sectitle { font-size:12px; color:var(--dim); font-weight:600; padding:6px 0; }
.muted { color:var(--dim); padding:10px 12px; font-size:12px; }
input[type=color] { width:100%; min-width:0; height:29px; padding:2px; }
.hit { color:var(--dim); font-size:11px; padding:1px 0 3px; }
.hit:empty { display:none; }
#toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,8px); display:flex;
         align-items:center; gap:8px; background:#1c1c21; color:#fff; padding:9px 14px;
         border-radius:8px; font-size:13px; opacity:0; pointer-events:none; z-index:40;
         transition:opacity .18s ease, transform .18s ease; box-shadow:0 6px 22px rgba(0,0,0,.22); }
#toast.on { opacity:1; transform:translate(-50%,0); }
#toast svg { flex:none; color:#5fd07a; }
#toast.bad svg { color:#ff7a7a; }
/* 进度态没有成功/失败图标，整块收起，文案不会因图标位右移 */
#toast.run svg { display:none; }
#modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; }
#modal[hidden] { display:none; }
#modal .mask { position:absolute; inset:0; background:rgba(24,24,28,.35); }
#modal .card { position:relative; width:min(380px, 86vw); background:#fff; border:1px solid var(--bd);
               border-radius:10px; padding:16px 18px; box-shadow:0 12px 34px rgba(0,0,0,.18); }
#modal h4 { margin:0; font-size:14px; }
#modal .body { margin:9px 0 0; color:var(--dim); font-size:12.5px; line-height:1.7;
               max-height:38vh; overflow:auto; word-break:break-all; }
#modal .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
#modal .acts [hidden] { display:none; }
#mdOk.danger { background:#e5484d; border-color:#e5484d; color:#fff; }
#mdOk.danger:hover:not(:disabled) { background:#d43a3f; border-color:#d43a3f; color:#fff; }
#logo { width:24px; height:24px; flex:none; margin-right:-2px; }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
/* 扫光的「亮度」判据：整数系数与 gif_engine.py 完全一致，别改成浮点 */
const lum = (r, g, b) => (77 * r + 150 * g + 29 * b) >> 8;

/* scene 与 gif_engine.py 的 scene.json 同构；assets 只在纯前端这一侧存在 */
let scene = null;
const assets = Object.create(null);      // name -> {url,img,data,w,h,bbox}
let sel = null, cur = 0, playing = false, timer = null;
let secOpen = { 位移: true, 旋转: true, 缩放呼吸: true, 扫光: true };

const CW = () => assets[scene?.stack?.[0]]?.w || 0;
const CH = () => assets[scene?.stack?.[0]]?.h || 0;
const projectName = () => (scene?.name || 'loop').trim() || 'loop';

/* ---------- helpers ---------- */
/* 层面板的扁平键按 [层名, 字段] 传数组：层名里带点（「时钟.v2」）时不能再走 '.' 拆分，
   否则值会落进 scene['时钟']， animate 永远是空的 */
let setPath = (obj, path, val) => {
  const ks = Array.isArray(path) ? path : path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] ??= {};
  if (val === '' || val === null) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
};
let getPath = (obj, path) => (Array.isArray(path) ? path : path.split('.')).reduce(
  (o, k) => o?.[k], obj);

const sanitize = sc => {
  const o = JSON.parse(JSON.stringify(sc));
  o.animate = o.animate || {};
  for (const n of o.stack || []) delete o[n];   // 扁平编辑键只活在内存里
  for (const [k, a] of Object.entries(o.animate)) {
    const z = v => !v || Math.abs(v.x || 0) < 1e-9 && Math.abs(v.y || 0) < 1e-9;
    if ('size' in a && !(a.size.w > 0 && a.size.h > 0)) delete a.size;
    if ('translate' in a && z(a.translate)) delete a.translate;
    if ('rotate' in a && !(a.rotate.turns)) delete a.rotate;
    if ('scale' in a && !(a.scale.amp)) delete a.scale;
    if ('shimmer' in a && !(a.shimmer?.range)) delete a.shimmer;
    if (!Object.keys(a).length) delete o.animate[k];
  }
  delete o.shimmer; delete o.__on;
  if (!o.alpha) { delete o.alpha; delete o.alphaMatte; }
  return o;
};

function newScene(name) {
  scene = { name: name || '', dir: '', out: 'loop.gif', w: 300, h: 300,
            frames: 32, duration: 50, stack: [], animate: {} };
}

function readAsDataURL(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f);
  });
}
function loadImg(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => rej(new Error('图片解码失败')); im.src = url;
  });
}
const scratch = document.createElement('canvas');
function pixelsOf(im) {
  scratch.width = im.naturalWidth; scratch.height = im.naturalHeight;
  const c = scratch.getContext('2d', { willReadFrequently: true });
  c.clearRect(0, 0, scratch.width, scratch.height);
  c.drawImage(im, 0, 0);
  return c.getImageData(0, 0, scratch.width, scratch.height);
}
function bboxOf(px) {                    // 与 gif_engine._content_bbox 同口径：alpha > 0
  let x0 = px.width, y0 = px.height, x1 = -1, y1 = -1;
  const d = px.data;
  for (let y = 0; y < px.height; y++) for (let x = 0; x < px.width; x++) {
    if (d[(y * px.width + x) * 4 + 3] > 0) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return [x0, y0, x1, y1];
}
function pivotOf(name) {
  const a = assets[name] || assets[scene.stack[0]];
  if (!a) return [CW() / 2, CH() / 2];
  return [(a.bbox[0] + a.bbox[2]) / 2, (a.bbox[1] + a.bbox[3]) / 2];
}

/* ---------- 素材导入 ---------- */
async function addPngs(files) {
  const list = [...files].filter(f => /\.png$/i.test(f.name));
  if (!list.length) { toast('只接受 PNG 切片', true); return; }
  let added = 0, skipped = [], wrong = [];
  for (const f of list) {
    const name = f.name.replace(/\.png$/i, '');
    let img;
    try { img = await loadImg(await readAsDataURL(f)); }
    catch (e) { skipped.push(name); continue; }
    const cw = CW(), ch = CH();
    if (cw && (img.naturalWidth !== cw || img.naturalHeight !== ch)) {
      wrong.push(f.name + '：' + img.naturalWidth + '×' + img.naturalHeight); continue;
    }
    if (!scene) newScene();
    const px = pixelsOf(img);
    assets[name] = { url: img.src, img, data: px.data, w: px.width, h: px.height, bbox: bboxOf(px) };
    if (!scene.stack.includes(name)) scene.stack.push(name);
    added++;
  }
  if (added) {
    if (!sel || !assets[sel]) sel = scene.stack.at(-1) || null;
    refresh();
    toast('已添加 ' + added + ' 张素材');
  }
  if (skipped.length) toast('这几张 PNG 读不出来：' + skipped.join('、'), true);
  if (wrong.length) dialog(
    wrong.length + ' 张切片与画布尺寸不同，已跳过',
    ['画布 ' + CW() + '×' + CH() + '，切片必须同宽同高：', ...wrong,
     '想整批改尺寸：点左栏「清空」删掉全部素材，再拖入新的第一张切片。']);
  $('#filePng').value = '';
}

function dropAsset(name) {
  delete assets[name]; delete scene.animate[name]; delete scene[name];
  scene.stack = scene.stack.filter(n => n !== name);
  if (sel === name) sel = scene.stack.at(-1) || null;
  refresh();
}

function clearAssets() {
  const n = scene.stack.length;
  for (const name of [...Object.keys(assets), ...scene.stack]) {
    delete assets[name]; delete scene.animate[name]; delete scene[name];
  }
  scene.stack = []; scene.animate = {};
  sel = null; cur = 0; setPlay(false); refresh();
  toast('已清空 ' + n + ' 张素材');
}

/* ---------- 帧渲染（与 gif_engine.render 同数学） ---------- */
const sine = (a, t) => {
  const s = Math.sin(TAU * ((a.cycles ?? 1) * t + (a.phase ?? 0)));
  return [(a.x || 0) * s, (a.y || 0) * s];
};

/* 带宽默认随切片画布走：光带 σ 要明显窄于画布才看得出「扫」，600px→72、80px→8 */
function shimW0() { return Math.max(8, Math.round(CW() * 0.12 / 4) * 4); }

function shimMask(a, shim) {
  const slope = shim.slope ?? 0.35, [lo, hi] = shim.range ?? [0, 255];
  const key = slope + ':' + lo + ':' + hi;
  if (a._mk === key) return a._m;
  const xs = [], ys = [], d = a.data;
  for (let y = 0; y < a.h; y++) for (let x = 0; x < a.w; x++) {
    const o = (y * a.w + x) * 4;
    if (d[o + 3] <= 200) continue;
    if (lum(d[o], d[o + 1], d[o + 2]) < lo) continue;
    if (lum(d[o], d[o + 1], d[o + 2]) > hi) continue;
    xs.push(x); ys.push(y);
  }
  a._mk = key;
  return a._m = { slope, n: xs.length, x: Int32Array.from(xs), y: Int32Array.from(ys) };
}

function paintFrame(ctx, w, h, i, alpha) {
  const t = i / scene.frames;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  // 白底是「导出必不透明」的老前提；透明模式改由 GCE 的透明索引表达，这里不再铺色
  if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  for (const name of scene.stack) {
    const a = assets[name]; if (!a) continue;
    const an = scene.animate[name] || {};
    const dw = an.size?.w || w, dh = an.size?.h || h;
    const sx = dw / w, sy = dh / h;
    let dx = 0, dy = 0;
    if (an.translate) { const [x, y] = sine(an.translate, t); dx = Math.round(x); dy = Math.round(y); }
    let s = 1, ax = w / 2, ay = h / 2;
    if (an.scale) {
      const sc = an.scale;
      s = 1 + (sc.amp || 0) * Math.sin(TAU * ((sc.cycles ?? 1) * t + (sc.phase ?? 0)));
      if (sc.anchor === 'bottom-center') ay = h;
      else if (sc.anchor === 'asset') { ax = (a.bbox[0] + a.bbox[2]) / 2; ay = (a.bbox[1] + a.bbox[3]) / 2; }
    }
    ctx.save();
    ctx.translate(dx + ax * (1 - s), dy + ay * (1 - s));
    ctx.scale(s, s);
    if (an.rotate) {
      const p = pivotOf(an.rotate.pivot_layer || name);
      ctx.translate(p[0], p[1]);
      ctx.rotate(TAU * (an.rotate.turns || 0) * t);
      ctx.translate(-p[0], -p[1]);
    }
    ctx.drawImage(a.img, 0, 0, dw, dh);
    ctx.restore();
    if (an.shimmer) {
      const m = shimMask(a, an.shimmer), W = an.shimmer.width ?? shimW0();
      if (!m.n) continue;
      const pos = -3 * W + (w + 6 * W) * t, str = an.shimmer.strength ?? 0.45;
      const img = ctx.getImageData(0, 0, w, h), d = img.data;
      for (let k = 0; k < m.n; k++) {
        const mx = m.x[k] * sx, my = m.y[k] * sy;
        const u = (mx + m.slope * my - pos) / W;
        if (u <= -3 || u >= 3) continue;
        const x = Math.round(mx) + dx, y = Math.round(my) + dy;
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const kk = Math.exp(-u * u) * str, o = (y * w + x) * 4;
        if (!alpha) {
          d[o] += (255 - d[o]) * kk; d[o + 1] += (255 - d[o + 1]) * kk;
          d[o + 2] += (255 - d[o + 2]) * kk;
        } else {
          /* getImageData/putImageData 走的是预乘 alpha：纯透明处 rgb 必为 0，
             所以先按 a/255 还原出直通色再提亮，最后把同一个系数乘回 alpha 上——
             只提 rgb 不提 a 的话，合成结果没变化，透明模式下扫光等于没开。 */
          const al = d[o + 3];
          if (!al) continue;
          const k = 1 + (255 / al - 1) * kk;
          d[o] *= k; d[o + 1] *= k; d[o + 2] *= k;
          d[o + 3] = Math.min(255, al * (1 + kk));
        }
      }
      ctx.putImageData(img, 0, 0);
    }
  }
}

const layerBuf = document.createElement('canvas');
/* 预览用的逐级折半缩图：够快，糊一点看不出来 */
function blit(ctx, src, dw, dh) {
  let cur = src, cw = src.width, ch = src.height;
  while (cw / 2 >= dw && ch / 2 >= dh) {
    const t = document.createElement('canvas');
    t.width = cw >> 1; t.height = ch >> 1;
    const tc = t.getContext('2d');
    tc.imageSmoothingEnabled = true; tc.imageSmoothingQuality = 'high';
    tc.drawImage(cur, 0, 0, t.width, t.height);
    cur = t; cw = t.width; ch = t.height;
  }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0, 0, dw, dh);
  ctx.drawImage(cur, 0, 0, dw, dh);

/* GIF 只有一个透明色索引，半透明像素必须被「摊派」成 透/不透 两种结果。
   进来的 px 一律是直通色 + alpha（两个出口各自负责还原，见 resampleLZ）。
   matte 是这张 GIF 将来被叠在什么颜色上：判成「不透」的像素会把 m(1−a) 预先合成进色表，
   所以边缘只有对着 matte 看才对得上原图，查看方换背景就会偏。
   摊法固定用误差扩散：切不完的覆盖率往后邻像素推，边缘从中距离看浓淡和原图一致。 */
function quantizeFrame(px, w, h, map, opt) {
  const n = w * h, idx = new Uint8Array(n);
  const { alpha, mr, mg, mb } = opt;
  if (!alpha) {
    for (let p = 0, q = 0; p < n; p++, q += 4) idx[p] = map(px[q], px[q + 1], px[q + 2]);
    return idx;
  }
  const err = new Float32Array(n + w + 1);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x, q = p * 4;
      const cov = px[q + 3] / 255;
      let a = cov + err[p];
      a = a < 0 ? 0 : a > 1 ? 1 : a;
      const e = cov - a;
      if (e) {
        err[p + 1] += e * 0.4375; err[p + w] += e * 0.3125;
        err[p + w + 1] += e * 0.1875; err[p + w + 2] += e * 0.0625;
      }
      if (a < 0.5) { idx[p] = 0; continue; }
      /* px[q] 是直通色 c。GIF 只有二值透明，被判定为「不透」的那批像素会以 k=1 显示，
         查看器不会再乘一次覆盖率——所以该存的就是合成结果 c·a + m(1−a)，
         把 matte 的贡献预先画进色表。乘 a 只会变小，不会溢出，无需特殊处理小 a。 */
      const ri = Math.round(px[q] * a + mr * (1 - a));
      const gi = Math.round(px[q + 1] * a + mg * (1 - a));
      const bi = Math.round(px[q + 2] * a + mb * (1 - a));
      idx[p] = map(ri < 0 ? 0 : ri > 255 ? 255 : ri,
                   gi < 0 ? 0 : gi > 255 ? 255 : gi,
                   bi < 0 ? 0 : bi > 255 ? 255 : bi);
    }
  }
  return idx;
}
class Bits {
  constructor() { this.a = []; this.cur = 0; this.n = 0; }
  write(code, size) {
    this.cur |= code << this.n; this.n += size;
    while (this.n >= 8) { this.a.push(this.cur & 255); this.cur >>>= 8; this.n -= 8; }
  }
  end() { if (this.n > 0) this.a.push(this.cur & 255); return Uint8Array.from(this.a); }
}
function lzw(idx) {                        // GIF LZW，minCodeSize 固定 8
  const MIN = 8, clear = 1 << MIN, eoi = clear + 1;
  let size = MIN + 1, next = eoi + 1, table = new Map();
  const bw = new Bits();
  bw.write(clear, size);
  let cur = idx[0];
  for (let i = 1; i < idx.length; i++) {
    const k = idx[i], key = (cur << 8) | k, hit = table.get(key);
    if (hit !== undefined) { cur = hit; continue; }
    bw.write(cur, size);
    table.set(key, next++);
    if (next > (1 << size)) {        // 解码器按「晚一位」扩位；提前一位 PIL 会报 broken data stream
      if (size < 12) size++;
      else { bw.write(clear, size); next = eoi + 1; size = MIN + 1; table = new Map(); }
    }
    cur = k;
  }
  bw.write(cur, size); bw.write(eoi, size);
  return bw.end();
}
function gifBytes(pal, indexFrames, w, h, delayMs, alpha) {
  const enc = s => new TextEncoder().encode(s);
  const parts = [];
  const hdr = new Uint8Array(13);
  hdr.set(enc('GIF89a'), 0);
  hdr[6] = w & 255; hdr[7] = w >> 8; hdr[8] = h & 255; hdr[9] = h >> 8;
  hdr[10] = 0x87; hdr[11] = 0; hdr[12] = 0;                    // GCT 256 色
  parts.push(hdr);
  /* 透明色固定用索引 0：GCE 只能指定一个索引值，把它放在 0 号槽，
     调色板整体后移一格，就不会有实色像素被误判成透明 */
  const gct = new Uint8Array(768);
  if (alpha) gct.set(pal.subarray(3), 3); else gct.set(pal, 0);
  parts.push(gct);
  const app = new Uint8Array(19);
  app.set([0x21, 0xFF, 0x0B], 0); app.set(enc('NETSCAPE2.0'), 3);
  app[14] = 3; app[15] = 1; app[16] = 0; app[17] = 0; app[18] = 0;   // 无限循环
  parts.push(app);
  const delay = Math.max(2, Math.round(delayMs / 10));
  /* 透明用索引 0（GCE 第 7 字节），处置用 2=还原背景：
     每帧都是整幅重画，处置=1 会让上一帧的边缘留在透明处（动画拖影），
     而预览是逐帧独立画的，只有 2 才对得上 */
  const gceFlags = alpha ? 0x09 : 0x04;
  for (const idx of indexFrames) {
    /* GCE 共 8 字节：0x21 0xF9 | 块长 4 | 处置+延时+透明索引 4 字节 | 块终止符 0
       透明索引固定 0，第 7 字节与终止符都是 0，但不能多写一个 */
    const gce = new Uint8Array([0x21, 0xF9, 4, gceFlags, delay & 255, delay >> 8, 0, 0x00]);
    const desc = new Uint8Array(10);
    desc[0] = 0x2C; desc[5] = w & 255; desc[6] = w >> 8; desc[7] = h & 255; desc[8] = h >> 8;
    const code = lzw(idx);
    const blocks = new Uint8Array(code.length + Math.ceil(code.length / 255) + 2);
    let o = 0;
    blocks[o++] = 8;
    for (let p = 0; p < code.length; p += 255) {
      const n = Math.min(255, code.length - p);
      blocks[o++] = n; blocks.set(code.subarray(p, p + n), o); o += n;
    }
    blocks[o++] = 0;
    parts.push(gce, desc, blocks.subarray(0, o));
  }
  parts.push(new Uint8Array([0x3B]));
  return parts;
}

/* ---------- 导出 ---------- */
const tick = () => new Promise(r => setTimeout(r, 0));
async function exportGif() {
  if (!scene?.stack.length) return;
  // 空着的输入框、或手改过的 JSON 都可能把 NaN/0 带进来：那样 resampleLZ 和量化全废，
  // 最后写出去一个几十字节的假 GIF 还弹「已导出」，所以在这儿拦住
  const ok = Number.isInteger(scene.w) && scene.w >= 1 &&
             Number.isInteger(scene.h) && scene.h >= 1 &&
             Number.isInteger(scene.frames) && scene.frames >= 2 &&
             Number.isFinite(scene.duration) && scene.duration >= 20;
  if (!ok) { toast('导出参数不合法：宽高要整数≥1、帧数≥2、时长≥20ms', true); return; }
  setPlay(false);
  const t0 = performance.now(), bw = CW(), bh = CH(), N = scene.frames;
  const alpha = !!scene.alpha;
  const matte = /^#[0-9a-f]{6}$/i.test(scene.alphaMatte || '') ? scene.alphaMatte : '#ffffff';
  const opt = { alpha,
                mr: parseInt(matte.slice(1, 3), 16), mg: parseInt(matte.slice(3, 5), 16),
                mb: parseInt(matte.slice(5, 7), 16) };
  const big = document.createElement('canvas');
  big.width = bw; big.height = bh;
  const c1 = big.getContext('2d', { willReadFrequently: true });
  /* 一遍渲染、缓存缩好的像素：先挑几帧建全局调色板，再逐帧量化。
     渲染（尤其带扫光的 getImageData/putImageData）是最贵的一步，不能为建表多付一遍。 */
  /* 建表取样：均匀挑最多 8 帧，首尾必取。s 只能当目标数，不能同时当计数器，
     否则 sampleSet 永远追不上 s，循环不结束（整页会卡死在这里） */
  const ns = Math.min(8, N), sampleSet = new Set();
  for (let k = 0; k < ns; k++) sampleSet.add(Math.round(k * (N - 1) / (ns - 1)));
  const pxs = new Array(N);
  let done = 0;
  for (let i = 0; i < N; i++) {
    paintFrame(c1, bw, bh, i, alpha);
    pxs[i] = resampleLZ(c1.getImageData(0, 0, bw, bh).data, bw, bh, scene.w, scene.h, alpha);
    progress('导出中 · 渲染 ' + (++done) + '/' + N);
    if (i % 3 === 2) await tick();
  }
  const pal = paletteOf(mergeSamples([...sampleSet].sort((a, b) => a - b)
                                      .map(i => (alpha ? compMatte(pxs[i], opt) : pxs[i]))), alpha);
  const map = colorMapper(pal, alpha);
  const frames = [];
  for (let i = 0; i < N; i++) {
    frames.push(quantizeFrame(pxs[i], scene.w, scene.h, map, opt));
    pxs[i] = null;
    progress('导出中 · 量化 ' + (++done) + '/' + (N * 2));
    if (i % 8 === 7) await tick();
  }
  const blob = new Blob(gifBytes(pal, frames, scene.w, scene.h, scene.duration, alpha),
                        { type: 'image/gif' });
  progress('导出中 · LZW');
  await tick();
  save(blob, projectName() + (alpha ? '_透明' : '') + '.gif');
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  toast('已导出到「下载」 · ' + Math.max(1, Math.round(blob.size / 1024)) + 'kb · ' + secs + 's');
}
/* 建表取样按 matte 合成，而不是把半透明像素丢掉：quantizeFrame 写进色表的正是这种
   合成色（c·a + m(1−a)），色表里没有它们的近邻，边缘就会被拽回素材本体的深色。
   a<8 的是真透明、不占槽；实心像素 a=255 时合成色等于原色，本体颜色一个不丢。 */
function compMatte(px, opt) {
  const out = new Uint8Array(px.length);
  let n = 0;
  for (let i = 0; i < px.length; i += 4) {
    const a = px[i + 3];
    if (a < 8) continue;
    const k = a / 255;
    out[n] = px[i] * k + opt.mr * (1 - k);
    out[n + 1] = px[i + 1] * k + opt.mg * (1 - k);
    out[n + 2] = px[i + 2] * k + opt.mb * (1 - k);
    out[n + 3] = 255;
    n += 4;
  }
  return out.subarray(0, n);
}
/* 取样按像素数封顶：中位切分的开销跟着色数走，8 帧全量足够建表，再多只拖时间 */
function mergeSamples(list, maxPx = 30000) {
  const totalPx = list.reduce((s, a) => s + a.length / 4, 0);
  const stride = Math.max(1, Math.ceil(totalPx / maxPx));
  const keep = list.reduce((s, a) => s + Math.ceil(a.length / 4 / stride), 0);
  const out = new Uint8Array(keep * 4);
  let o = 0;
  for (const a of list) {
    for (let i = 0; i + 3 < a.length; i += stride * 4) {
      out[o] = a[i]; out[o + 1] = a[i + 1]; out[o + 2] = a[i + 2]; out[o + 3] = a[i + 3];
      o += 4;
    }
  }
  return out.subarray(0, o);
}
function save(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 6000);
}

/* ---------- 文件：保存 / 导入 ---------- */
async function saveFile() {
  if (!scene) return;
  commitLayerKeys();
  const o = sanitize(scene);
  o.assets = Object.fromEntries(scene.stack.filter(n => assets[n]).map(n => [n, assets[n].url]));
  const blob = new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' });
  save(blob, projectName() + '.json');
  toast('已导出 ' + projectName() + '.json（含 ' + Object.keys(o.assets).length + ' 张素材）');
}
async function applyProject(o, nameFallback) {
  if (!Array.isArray(o.stack)) { toast('文件里没有 stack 字段，不像本工具的动画文件', true); return false; }
  const map = o.assets;
  if (!map || typeof map !== 'object') {
    toast('这个文件没有内联素材，只能导入「保存文件」导出的 JSON', true); return false;
  }
  const fresh = {}, failed = [];
  for (const n of o.stack) {
    if (!map[n]) { failed.push(n); continue; }
    try {
      const img = await loadImg(map[n]), px = pixelsOf(img);
      fresh[n] = { url: map[n], img, data: px.data, w: px.width, h: px.height, bbox: bboxOf(px) };
    } catch (e) { failed.push(n); }
  }
  if (failed.length) { toast('素材不全，没有导入：' + failed.join('、'), true); return false; }
  // 手写的 scene.json 可能带 NaN/0/字符串宽高、1 帧、非法时长：先归一到能渲染的值，
  // 否则 draw() 里 cv.width 直接变 0、meta 显示 NaN，导出的图也是坏的
  const num = (v, d, lo, hi) => {
    const n = Math.round(+v);
    if (!Number.isFinite(n) || n === 0) return d;   // 0 和非数按老行为用默认值，其余夹进合法区间
    return Math.min(hi, Math.max(lo, n));
  };
  for (const n of Object.keys(assets)) delete assets[n];
  Object.assign(assets, fresh);
  scene = { name: o.name || nameFallback, dir: o.dir || '',
            out: o.out || 'loop.gif', w: num(o.w, 300, 1, 4096), h: num(o.h, 300, 1, 4096),
            frames: num(o.frames, 32, 2, 500), duration: num(o.duration, 50, 20, 1000),
            stack: o.stack.map(String), animate: o.animate || {},
            alpha: !!o.alpha,
            alphaMatte: /^#[0-9a-f]{6}$/i.test(o.alphaMatte || '') ? o.alphaMatte : '#ffffff' };
  sel = scene.stack.at(-1) || null;
  cur = 0; setPlay(false); refresh();
  toast('已载入 ' + scene.stack.length + ' 张素材');
  return true;
}
async function openFile(file) {
  let o;
  try { o = JSON.parse(await file.text()); }
  catch (e) { toast('这个文件不是合法的 JSON', true); $('#fileJson').value = ''; return; }
  await applyProject(o, file.name.replace(/\.json$/i, ''));
  $('#fileJson').value = '';
}
/* 测试用例内联在 #testCase 里（同目录 test.json 的压缩副本）：file:// 下 fetch 不到本地文件，
   所以只能塞进 HTML；默认进来就是它，「载入测试用例」再点一次等于回到原点。 */
const testCase = () => JSON.parse($('#testCase').textContent);
function newProject() {
  clearAssets(); newScene(); refresh();
  toast('已新建空项目');
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, bad) {
  $('#toastMsg').textContent = msg;
  const el = $('#toast');
  el.classList.remove('run');
  el.classList.toggle('bad', !!bad);
  el.querySelector('path').setAttribute('d', bad ? 'M4 4l8 8M12 4l-8 8' : 'M3 8.6l3.1 3.1L13 4.8');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 3200);
}
/* 导出进度也走这个底部提示：它既不是成功也不是失败，所以挂 run 态把图标收起来，
   并且不设 3200ms 自动收起——下一条进度会覆盖文案，收尾交给 toast()。 */
function progress(msg) {
  $('#toastMsg').textContent = msg;
  const el = $('#toast');
  el.classList.remove('bad');
  el.classList.add('run', 'on');
  clearTimeout(toastTimer);
}

/* ---------- 全局弹窗 ---------- */
let mdAction = null;
const mdBtn = $('#mdOk');
function dialog(title, lines, ok) {       // ok = { text, danger, fn }：给了就是确认框
  $('#mdTitle').textContent = title;
  const b = $('#mdBody'); b.innerHTML = '';
  for (const l of lines) {
    const p = document.createElement('div'); p.textContent = l; b.appendChild(p);
  }
  mdBtn.textContent = ok ? ok.text : '知道了';
  mdBtn.classList.toggle('prim', !(ok && ok.danger));
  mdBtn.classList.toggle('danger', !!(ok && ok.danger));
  $('#mdCancel').hidden = !ok;
  mdAction = ok && ok.fn;
  $('#modal').hidden = false;
  mdBtn.focus();
}
const closeModal = () => {
  $('#modal').hidden = true;
  mdBtn.textContent = '知道了';
  mdBtn.classList.add('prim'); mdBtn.classList.remove('danger');
  $('#mdCancel').hidden = true; mdAction = null;
};
mdBtn.onclick = () => { const fn = mdAction; closeModal(); if (fn) fn(); };
$('#mdCancel').onclick = closeModal;
$('#modal .mask').onclick = closeModal;

/* ---------- 绑定 ---------- */
$('#drop').onclick = () => $('#filePng').click();
$('#clearAll').onclick = () => dialog('清空全部 ' + scene.stack.length + ' 张素材？',
  ['动画参数会一起清掉，撤销不了（切片文件本身不受影响）。'],
  { text: '清空', danger: true, fn: clearAssets });
$('#filePng').onchange = e => addPngs(e.target.files);
$('#mOpen').onclick = () => $('#fileJson').click();
$('#fileJson').onchange = e => openFile(e.target.files[0]);
$('#mSave').onclick = saveFile;
$('#mNew').onclick = () => {
  if (!scene.stack.length) { newProject(); return; }
  dialog('新建空项目？',
    ['当前 ' + scene.stack.length + ' 张素材和动画参数会被清掉，撤销不了（切片文件本身不受影响）。'],
    { text: '新建', danger: true, fn: newProject });
};
$('#mTest').onclick = () => applyProject(testCase(), '测试用例');
$('#expGif').onclick = exportGif;
$('#scrub').oninput = e => { setPlay(false); draw(+e.target.value); };
$('#play').onclick = () => setPlay(!playing);
$('#fileBtn').onclick = e => { e.stopPropagation(); $('#fileMenu').classList.toggle('on'); };
document.addEventListener('click', () => $('#fileMenu').classList.remove('on'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); $('#fileMenu').classList.remove('on'); return; }
  if (!$('#modal').hidden) return;
  if (!scene || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  if (e.key === 'ArrowLeft') { setPlay(false); draw(cur - 1); }
  if (e.key === 'ArrowRight') { setPlay(false); draw(cur + 1); }
});
const panel = document.querySelector('.panel');
for (const ev of ['dragenter', 'dragover']) panel.addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.add('hot');
});
panel.addEventListener('dragleave', () => $('#drop').classList.remove('hot'));
panel.addEventListener('drop', e => {
  e.preventDefault(); $('#drop').classList.remove('hot');
  if (e.dataTransfer?.files?.length) addPngs(e.dataTransfer.files);
});

newScene(); refresh();
applyProject(testCase(), '测试用例');   // 默认进来就是测试用例：五层各演一种动画，打开就能看
</script>
</body>
